name: Discover Mak3Deals retailer promotions

on:
  schedule:
    - cron: "11 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Run the protected daily source review pass
        env:
          REFRESH_TOKEN: ${{ secrets.MAK3DEALS_REFRESH_TOKEN }}
        run: >-
          curl --fail --silent --show-error --retry 3 --retry-delay 10
          --max-time 120 --request POST
          --header "X-Mak3Deals-Refresh-Token: ${REFRESH_TOKEN}"
          https://mak3deals.com/internal/discover-retailer-deals
