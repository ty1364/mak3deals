services:
  - type: web
    name: mak3deals
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mak3deals-db
          property: connectionString
      - key: MAK3DEALS_SECRET_KEY
        generateValue: true
      - key: MAK3DEALS_ADMIN_TOKEN
        generateValue: true
      - key: MAK3DEALS_REFRESH_TOKEN
        sync: false
      - key: MAK3DEALS_FEED_CONFIG
        sync: false
      - key: MAK3DEALS_COOKIE_SECURE
        value: "1"
      - key: MAK3DEALS_DEPLOY_ENV
        value: production

databases:
  - name: mak3deals-db
    databaseName: mak3deals
    plan: 0.1c-256mb
    diskSizeGB: 1
